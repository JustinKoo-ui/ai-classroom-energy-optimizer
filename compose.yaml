services:
  postgres:
    image: postgres:16
    container_name: aceo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aceo
      POSTGRES_USER: aceo
      POSTGRES_PASSWORD: aceo-dev-password
    ports:
      - "5432:5432"
    volumes:
      - aceo-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aceo -d aceo"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    container_name: aceo-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - aceo-mqtt-data:/mosquitto/data
      - aceo-mqtt-log:/mosquitto/log

volumes:
  aceo-postgres-data:
  aceo-mqtt-data:
  aceo-mqtt-log:
